<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#07C160">
  <title>jiojio厨房 · 点菜</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
</head>
<body>
  <div id="app">

    <!-- ============ 菜单（用户点菜） ============ -->
    <section class="view" id="view-menu">
      <header class="topbar">
        <div class="shop-name">🍳 jiojio厨房</div>
        <div class="shop-sub">勾选想吃的菜，约个时间，我来做</div>
        <a class="user-entry" id="user-entry">登录 / 注册</a>
      </header>
      <div class="page-body" id="menu-list"></div>
      <!-- 底部结算条 -->
      <div class="order-bar" id="order-bar" hidden>
        <div class="order-bar-info">
          <span>已选 <b id="sel-count">0</b> 份 · 合计 ¥<b id="sel-total">0</b></span>
          <a class="clear-link" id="clear-sel">清空</a>
        </div>
        <button class="btn btn-primary" id="go-order">预约下单</button>
      </div>
    </section>

    <!-- ============ 菜品详情（点菜单里的「评分 / 暂无评价 ›」进入） ============ -->
    <section class="view" id="view-dish" hidden>
      <header class="topbar">
        <div class="shop-name">菜品详情</div>
        <a class="admin-exit" href="#menu">← 返回菜单</a>
      </header>
      <div class="page-body" id="dish-body"></div>
    </section>

    <!-- ============ 我的订单 ============ -->
    <section class="view" id="view-orders" hidden>
      <header class="topbar"><div class="shop-name">我的订单</div></header>
      <div class="page-body" id="orders-list"></div>
    </section>

    <!-- ============ 评价 ============ -->
    <section class="view" id="view-reviews" hidden>
      <header class="topbar"><div class="shop-name">评价</div></header>
      <div class="page-body" id="reviews-body"></div>
    </section>

    <!-- ============ 管理后台 ============ -->
    <section class="view" id="view-admin" hidden>
      <header class="topbar">
        <div class="shop-name">店铺管理</div>
        <a class="admin-exit" href="#menu">← 返回点菜</a>
      </header>
      <!-- 未登录 -->
      <div class="page-body" id="admin-login">
        <div class="card login-card">
          <p class="login-title">🔐 店主登录</p>
          <input type="password" id="admin-pwd" placeholder="输入管理密码" class="input">
          <button class="btn btn-primary btn-block" id="admin-login-btn">登录</button>
        </div>
      </div>
      <!-- 已登录 -->
      <div id="admin-panel" hidden>
        <div class="admin-tabs">
          <button class="atab active" data-atab="orders">订单</button>
          <button class="atab" data-atab="dishes">菜品管理</button>
          <button class="atab" data-atab="reviews">评价</button>
        </div>
        <div class="page-body" id="admin-body"></div>
      </div>
    </section>

    <!-- ============ 底部导航 ============ -->
    <nav class="tabbar">
      <button class="tab active" data-view="menu">🍚<span>菜单</span></button>
      <button class="tab" data-view="orders">📋<span>订单</span></button>
      <button class="tab" data-view="reviews">⭐<span>评价</span></button>
      <button class="tab" data-view="admin">⚙️<span>管理</span></button>
    </nav>
  </div>

  <!-- 弹层 -->
  <div class="modal-mask" id="modal" hidden>
    <div class="modal-card" id="modal-card"></div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/app.js"></script>
</body>
</html>
